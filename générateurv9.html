<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Le Studio de Patterns - Séquenceur Pianotement</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e272e; color: #f5f6fa; margin: 0; padding: 20px; }
  
  .header-generateur { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 20px; }
  h1 { color: #00d2d3; margin: 0; }
  
  .btn-youtube { background: #ff4757; color: white; text-decoration: none; padding: 8px 15px; font-weight: bold; border-radius: 4px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; transition: background 0.2s; }
  .btn-youtube:hover { background: #ff6b81; }

  .container { display: flex; gap: 20px; max-width: 1300px; margin: 0 auto; }
  .panel { flex: 1; background: #2f3640; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 10px; }
  
  label { display: block; margin-top: 5px; font-weight: bold; color: #dcdde1; }
  button, input[type="text"], input[type="number"], textarea { width: 100%; padding: 10px; border-radius: 4px; border: none; font-size: 15px; box-sizing: border-box; }
  
  .radio-group { display: flex; gap: 15px; margin: 5px 0; }
  .radio-group label { display: inline; font-weight: normal; }
  
  /* INTERFACE TABLEAU DE BORD (CASES À COCHER SANS MENU DÉROULANT) */
  .notes-dashboard { background: #222f3e; padding: 15px; border-radius: 6px; display: flex; flex-direction: column; gap: 12px; }
  .octave-row h4 { margin: 0 0 6px 0; color: #f1c40f; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
  .notes-checkbox-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .fingers-checkbox-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; background: #222f3e; padding: 12px; border-radius: 6px; }
  
  .chk-card { position: relative; }
  .chk-card input[type="checkbox"] { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; z-index: 2; margin: 0; }
  .chk-card label { display: block; text-align: center; background: #353b48; padding: 10px 2px; border-radius: 4px; font-size: 13px; font-weight: bold; color: #dcdde1; transition: all 0.15s; border: 1px solid transparent; cursor: pointer; margin: 0; }
  .chk-card input[type="checkbox"]:checked + label { background: #3f48cc; color: white; border-color: #00d2d3; box-shadow: 0 0 8px rgba(0,210,211,0.4); }
  .chk-card:hover label { background: #4b5563; }

  .checkbox-container { display: flex; flex-direction: column; gap: 10px; margin: 10px 0; }
  .checkbox-group { background: #222f3e; padding: 12px 15px; border-radius: 4px; border-left: 4px solid #1dd1a1; }
  .checkbox-group.sustain-group { border-left-color: #f1c40f; }
  .checkbox-group label { display: inline; cursor: pointer; color: #1dd1a1; font-weight: bold; }
  .checkbox-group.sustain-group label { color: #f1c40f; }
  
  button.btn-add { background: #10ac84; color: white; font-weight: bold; cursor: pointer; margin-top: 5px; }
  button.btn-add:hover { background: #1dd1a1; }
  button.btn-generate { background: #2e86de; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 18px; }
  button.btn-generate:hover { background: #54a0ff; }
  button.btn-clear { background: #ee5253; color: white; cursor: pointer; }
  
  .project-box { background: #222f3e; padding: 15px; border-radius: 6px; border: 1px dashed #8395a7; margin-top: 15px; }
  .project-buttons { display: flex; gap: 10px; margin-top: 8px; }
  button.btn-save { background: #f1c40f; color: #222f3e; font-weight: bold; cursor: pointer; }
  button.btn-save:hover { background: #f39c12; }
  button.btn-load { background: #9b59b6; color: white; font-weight: bold; cursor: pointer; }
  button.btn-load:hover { background: #8e44ad; }

  /* ZONE EXTENSIBLE SANS SCROLLBAR */
  .sequence-preview { background: #222f3e; padding: 15px; border-radius: 4px; min-height: 80px; height: auto; }
  
  .step-block { background: #576574; padding: 8px 12px; margin: 6px 0; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; cursor: grab; user-select: none; }
  .step-block:active { cursor: grabbing; background: #485460; }
  .step-block.drag-over { border: 2px dashed #00d2d3; background: #3d4852; }
  
  .btn-delete-step { color: #ff4757; font-weight: bold; cursor: pointer; font-size: 16px; padding: 0 5px; }
  
  textarea { background: #222f3e; color: #1dd1a1; font-family: monospace; height: 140px; resize: vertical; }
  #annotationsInput { font-family: inherit; color: white; background: #353b48; height: 90px; }
  .copy-btn { background: #8395a7; color: white; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>

<div class="header-generateur">
  <h1>🎹 Le Studio de Patterns - Séquenceur</h1>
  <a href="https://www.youtube.com/@pianotement" target="_blank" class="btn-youtube">▶ Chaîne YouTube</a>
</div>

<div class="container">
  
  <!-- PANNEAU DE CONFIGURATION -->
  <div class="panel">
    <h2>1. Composer la Séquence</h2>
    
    <label>Sélectionner la ou les Note(s) :</label>
    <div id="noteCheckboxes" class="notes-dashboard"></div>
    
    <label>Doigté (Optionnel - Un seul choix) :</label>
    <div class="fingers-checkbox-grid">
      <div class="chk-card"><input type="checkbox" name="fingerChk" value="1" id="chk-f1"><label for="chk-f1">1</label></div>
      <div class="chk-card"><input type="checkbox" name="fingerChk" value="2" id="chk-f2"><label for="chk-f2">2</label></div>
      <div class="chk-card"><input type="checkbox" name="fingerChk" value="3" id="chk-f3"><label for="chk-f3">3</label></div>
      <div class="chk-card"><input type="checkbox" name="fingerChk" value="4" id="chk-f4"><label for="chk-f4">4</label></div>
      <div class="chk-card"><input type="checkbox" name="fingerChk" value="5" id="chk-f5"><label for="chk-f5">5</label></div>
    </div>
    
    <label>Mode d'intégration :</label>
    <div class="radio-group">
      <div>
        <input type="radio" id="modeSuccessive" name="timeMode" value="successive" checked>
        <label for="modeSuccessive">Note Successive</label>
      </div>
      <div>
        <input type="radio" id="modeSimultaneous" name="timeMode" value="simultaneous">
        <label for="modeSimultaneous">Note Simultanée (Grip)</label>
      </div>
    </div>
    
    <button class="btn-add" onclick="ajouterNote()">Ajouter au Pattern</button>
    <button class="btn-clear" onclick="reinitialiserSequence()">Vider toute la séquence</button>
    
    <h3>Aperçu interactif (Glisser pour ordonner, ✕ pour supprimer) :</h3>
    <div id="sequencePreview" class="sequence-preview">Aucune note pour le moment.</div>

    <!-- GESTION DE PROJET -->
    <div class="project-box">
      <strong>💾 Gestion de tes projets / Modèles d'élèves :</strong>
      <div class="project-buttons">
        <button class="btn-save" onclick="exporterProjet()">Sauvegarder le modèle (.json)</button>
        <button class="btn-load" onclick="declencherImport()">Charger un modèle</button>
      </div>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importerProjet(event)">
    </div>
  </div>
  
  <!-- PANNEAU DE GENERATION -->
  <div class="panel">
    <h2>2. Personnalisation & Notes Élève</h2>
    <label for="titleInput">Titre de l'exercice :</label>
    <input type="text" id="titleInput" value="Mon Arpège personnalisé">
    
    <label for="tempoInput">Vitesse du défilement (ms entre chaque temps) :</label>
    <input type="number" id="tempoInput" value="1500" step="50">

    <label for="annotationsInput">Notes de cours / Consignes pédagogiques pour l'élève :</label>
    <textarea id="annotationsInput" placeholder="Ex: Travaillez cet ostinato d'abord main gauche seule..."></textarea>

    <div class="checkbox-container">
      <div class="checkbox-group">
        <input type="checkbox" id="remanenceInput">
        <label for="remanenceInput">Activer la Rémanence (Empreinte verte globale)</label>
      </div>
      
      <div class="checkbox-group sustain-group">
        <input type="checkbox" id="sustainInput">
        <label for="sustainInput">Activer le Sustain (Le son tient toute la durée de la note)</label>
      </div>
    </div>

    <button class="btn-generate" onclick="genererCode()">Générer la Page Web Style "Pianotement" 🚀</button>
    
    <label for="outputCode">Code HTML final à copier :</label>
    <textarea id="outputCode" readonly placeholder="Le code apparaîtra ici..."></textarea>
    <button id="copyButton" class="copy-btn" onclick="copierCode()">Copier le code</button>
  </div>

</div>

<script>
  const notesBase = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const notesTrad = {'C':'Do', 'C#':'Do#', 'D':'Ré', 'D#':'Ré#', 'E':'Mi', 'F':'Fa', 'F#':'Fa#', 'G':'Sol', 'G#':'Sol#', 'A':'La', 'A#':'La#', 'B':'Si'};
  
  // Génération dynamique de la grille de cases à cocher pour les notes
  const noteContainer = document.getElementById('noteCheckboxes');
  for(let oct = 3; oct <= 5; oct++) {
    const octDiv = document.createElement('div');
    octDiv.classList.add('octave-row');
    octDiv.innerHTML = `<h4>Octave ${oct}</h4>`;
    
    const grid = document.createElement('div');
    grid.classList.add('notes-checkbox-grid');
    
    notesBase.forEach(n => {
      const id = n + oct;
      grid.innerHTML += `
        <div class="chk-card">
          <input type="checkbox" name="noteChk" value="${id}" id="chk-${id}">
          <label for="chk-${id}">${notesTrad[n]}</label>
        </div>
      `;
    });
    octDiv.appendChild(grid);
    noteContainer.appendChild(octDiv);
  }

  // Comportement exclusif pour les doigts (un seul choix possible à la fois)
  document.addEventListener('change', function(e) {
    if (e.target && e.target.name === 'fingerChk' && e.target.checked) {
      document.querySelectorAll('input[name="fingerChk"]').forEach(other => {
        if (other !== e.target) other.checked = false;
      });
    }
  });

  let sequence = [];
  let dragSrcIndex = null;

  function ajouterNote() {
    const checkedNotes = Array.from(document.querySelectorAll('input[name="noteChk"]:checked')).map(el => el.value);
    const checkedFingerEl = document.querySelector('input[name="fingerChk"]:checked');
    const doigt = checkedFingerEl ? checkedFingerEl.value : "";
    const mode = document.querySelector('input[name="timeMode"]:checked').value;
    
    if (checkedNotes.length === 0) {
      alert("Coche au moins une note dans la grille avant d'ajouter !");
      return;
    }
    
    if (mode === 'successive') {
      // Chaque note cochée génère son propre temps à la suite
      checkedNotes.forEach(note => {
        sequence.push([{ id: note, doigt: doigt }]);
      });
    } else {
      // Mode simultané (Grip / Accord)
      if (sequence.length === 0) {
        sequence.push(checkedNotes.map(note => ({ id: note, doigt: doigt })));
      } else {
        checkedNotes.forEach(note => {
          sequence[sequence.length - 1].push({ id: note, doigt: doigt });
        });
      }
    }
    
    mettreAJourApercu();

    // REMISE À ZÉRO STRATÉGIQUE COMPLÈTE DE TOUTES LES CASES À COCHER
    document.querySelectorAll('input[name="noteChk"]:checked').forEach(el => el.checked = false);
    document.querySelectorAll('input[name="fingerChk"]:checked').forEach(el => el.checked = false);
    document.getElementById('remanenceInput').checked = false;
    document.getElementById('sustainInput').checked = false;
  }

  function reinitialiserSequence() {
    sequence = [];
    mettreAJourApercu();
  }

  function supprimerEtape(index) {
    sequence.splice(index, 1);
    mettreAJourApercu();
  }

  function handleDragStart(e) {
    dragSrcIndex = this.getAttribute('data-index');
    e.dataTransfer.effectAllowed = 'move';
  }
  function handleDragOver(e) {
    e.preventDefault();
    this.classList.add('drag-over');
    return false;
  }
  function handleDragLeave(e) {
    this.classList.remove('drag-over');
  }
  function handleDrop(e) {
    e.preventDefault();
    this.classList.remove('drag-over');
    const targetIndex = this.getAttribute('data-index');
    if (dragSrcIndex !== null && dragSrcIndex !== targetIndex) {
      const movedItem = sequence.splice(dragSrcIndex, 1)[0];
      sequence.splice(targetIndex, 0, movedItem);
      mettreAJourApercu();
    }
  }

  function mettreAJourApercu() {
    const preview = document.getElementById('sequencePreview');
    if (sequence.length === 0) {
      preview.innerHTML = "Aucune note pour le moment.";
      return;
    }
    preview.innerHTML = "";
    sequence.forEach((temps, index) => {
      let notesText = temps.map(n => `${notesTrad[n.id.slice(0,-1)]}${n.id.slice(-1)} (${n.doigt ? 'Doigt '+n.doigt : 'X'})`).join(' + ');
      const block = document.createElement('div');
      block.classList.add('step-block');
      block.setAttribute('draggable', 'true');
      block.setAttribute('data-index', index);
      block.addEventListener('dragstart', handleDragStart);
      block.addEventListener('dragover', handleDragOver);
      block.addEventListener('dragleave', handleDragLeave);
      block.addEventListener('drop', handleDrop);
      block.innerHTML = `<span><strong>Temps ${index + 1} :</strong> ${notesText}</span>
                         <span class="btn-delete-step" onclick="supprimerEtape(${index})" title="Supprimer">✕</span>`;
      preview.appendChild(block);
    });
  }

  function exporterProjet() {
    if(sequence.length === 0) {
      alert("Crée d'abord une séquence avant de l'exporter !");
      return;
    }
    const config = {
      titre: document.getElementById('titleInput').value,
      tempo: document.getElementById('tempoInput').value,
      remanence: document.getElementById('remanenceInput').checked,
      sustain: document.getElementById('sustainInput').checked,
      annotations: document.getElementById('annotationsInput').value,
      sequence: sequence
    };
    const blob = new Blob([JSON.stringify(config, null, 2)], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = config.titre.replace(/[^a-z0-9]/gi, '_').toLowerCase() + "_config.json";
    a.click();
  }

  function declencherImport() {
    document.getElementById('importFile').click();
  }

  function importerProjet(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const config = JSON.parse(e.target.result);
        document.getElementById('titleInput').value = config.titre || "";
        document.getElementById('tempoInput').value = config.tempo || 1500;
        document.getElementById('remanenceInput').checked = config.remanence === true;
        document.getElementById('sustainInput').checked = config.sustain === true;
        document.getElementById('annotationsInput').value = config.annotations || "";
        sequence = config.sequence || [];
        mettreAJourApercu();
      } catch(err) {
        alert("Erreur : Ce fichier n'est pas un modèle valide.");
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  function copierCode() {
    const txt = document.getElementById('outputCode');
    const btn = document.getElementById('copyButton');
    if (!txt.value) return;
    navigator.clipboard.writeText(txt.value).then(() => {
      const originalText = btn.innerText;
      btn.innerText = "✓ Copié !";
      btn.style.background = "#2ecc71";
      setTimeout(() => { btn.innerText = originalText; btn.style.background = "#8395a7"; }, 1000);
    });
  }

  function genererCode() {
    if (sequence.length === 0) return;
    
    const titre = document.getElementById('titleInput').value;
    const tempo = document.getElementById('tempoInput').value;
    const remanence = document.getElementById('remanenceInput').checked;
    const sustain = document.getElementById('sustainInput').checked;
    const annotations = document.getElementById('annotationsInput').value;
    
    const sequenceJSON = JSON.stringify(sequence);
    const annotationsJSON = JSON.stringify(annotations);

    let template = `<!DOCTYPE html>

  header { background: #1b222a; border-bottom: 2px solid #232d38; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
  .header-left { display: flex; align-items: center; gap: 20px; }
  .logo-link { text-decoration: none; }
  .logo-site { font-size: 22px; font-weight: 800; color: #00d2d3; letter-spacing: 1px; text-transform: uppercase; }
  .logo-site span { color: #f1c40f; }
  .yt-header-btn { background: #ff4757; color: white; text-decoration: none; font-size: 12px; font-weight: bold; padding: 6px 12px; border-radius: 4px; display: inline-flex; align-items: center; gap: 4px; }
  .yt-header-btn:hover { background: #ff6b81; }
  .badge-eleve { background: #2e3d4d; color: #00d2d3; font-size: 13px; font-weight: bold; padding: 4px 12px; border-radius: 20px; border: 1px solid #3d5166; }
  .main-content { flex: 1; padding: 40px 20px; max-width: 1000px; margin: 0 auto; width: 100%; box-sizing: border-box; }
  .piano-container { background: #1b222a; padding: 35px; border-radius: 12px; border: 1px solid #232d38; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
  h2 { margin-top: 0; color: #ffffff; font-size: 26px; font-weight: 600; margin-bottom: 25px; }
  .piano-wrapper { overflow-x: auto; padding: 15px; background: #0f1318; border-radius: 8px; margin-bottom: 30px; box-shadow: inset 0 4px 10px rgba(0,0,0,0.5); }

<script>
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  const notesDef = [
    { n: 'C', t: 'white' }, { n: 'C#', t: 'black' }, { n: 'D', t: 'white' }, { n: 'D#', t: 'black' },
    { n: 'E', t: 'white' }, { n: 'F', t: 'white' }, { n: 'F#', t: 'black' }, { n: 'G', t: 'white' },
    { n: 'G#', t: 'black' }, { n: 'A', t: 'white' }, { n: 'A#', t: 'black' }, { n: 'B', t: 'white' }
  ];
  function getFrequency(noteName) {
    const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const name = noteName.slice(0, -1); const octave = parseInt(noteName.slice(-1));
    return 440 * Math.pow(2, ((notes.indexOf(name) + (octave + 1) * 12) - 69) / 12);
  }
  const piano = document.getElementById('pianoVisualizer');
  let whiteCount = 0;

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Arcade Piano - V8.1 (Débits Séparés par Clé)</title>
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background-color: #1e1e24; color: #fff; margin: 0; padding: 20px; overflow-x: hidden; }
        
        #menu-config { background: #2a2a35; max-width: 900px; margin: 20px auto; padding: 30px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); text-align: left; }
        #menu-config h2 { margin-top: 0; color: #f39c12; text-align: center; border-bottom: 2px solid #444; padding-bottom: 10px;}
        .config-group { margin-bottom: 15px; }
        .config-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #bdc3c7; }
        select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #555; background: #1e1e24; color: white; font-size: 16px; }
        .flex-row { display: flex; gap: 20px; margin-bottom: 15px; }
        .flex-row > div { flex: 1; }
        
        .panel { background: #222; padding: 15px; border-radius: 8px; border: 1px solid #444; margin-bottom: 15px; }
        .custom-ambitus-panel { display: none; margin-top: 10px; border: 1px dashed #555; padding: 10px;}

        #game-ui { display: none; }
        #hud { display: flex; justify-content: center; gap: 30px; font-size: 20px; font-weight: bold; margin: 15px; background: #2a2a35; padding: 15px; border-radius: 8px; align-items: center;}
        .stat { padding: 8px 16px; border-radius: 6px; }
        #stat-fautes { background: #c0392b; }
        #stat-score { background: #27ae60; }
        #stat-level { background: #2980b9; }
        #midi-status { color: #f1c40f; font-weight: bold; font-size: 18px; text-align: center; margin-bottom: 15px;}
        
        #viewport { position: relative; width: 900px; height: 450px; background: #ffffff; margin: 20px auto; border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 20px rgba(0,0,0,0.2); }
        #bg-staves { position: absolute; left: 0; top: 0; width: 900px; height: 450px; z-index: 1; }
        #fixed-clefs { position: absolute; left: 0; top: 0; width: 140px; height: 450px; z-index: 10; background: linear-gradient(to right, white 80%, transparent); }
        #hitzone { position: absolute; left: 150px; top: 0; width: 100px; height: 450px; background: rgba(231, 76, 60, 0.1); border-left: 2px dashed #e74c3c; border-right: 2px dashed #e74c3c; z-index: 15; box-shadow: 0 0 10px rgba(231,76,60,0.3); }
        #track { position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 5; }
        .note-column { position: absolute; top: 0; height: 450px; width: 100px; }

        .overlay-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 30; flex-direction: column; justify-content: center; align-items: center; }
        .overlay-screen h2 { color: #e74c3c; font-size: 48px; margin: 0 0 10px 0; }
        #pause-screen h2 { color: #f1c40f; }

        button { padding: 12px 20px; font-size: 18px; cursor: pointer; background: #27ae60; color: white; border: none; border-radius: 8px; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #219a52; }
        #btn-pause { background: #f39c12; }
        
        .main-title { text-align: center; margin-top: 0; margin-bottom: 25px; font-size: 42px; font-weight: bold; }
        .main-title a { color: #f39c12; text-decoration: none; transition: color 0.2s; }
        .main-title a:hover { color: #f1c40f; text-shadow: 0 0 10px rgba(243, 156, 18, 0.3); }
    </style>
</head>
<body>

    <p id="midi-status">En attente de connexion MIDI...</p>

    <div id="menu-config">
        <div class="main-title">
            <a href="https://www.pianotement.fr/" target="_blank">Pianotement.fr</a>
        </div>
        
        <h2>Paramètres de la partie</h2>
        
        <div class="flex-row">
            <div class="config-group">
                <label>Main Droite (Clé de Sol) :</label>
                <select id="cfg-mode-md">
                    <option value="melodie" selected>Mélodie</option>
                    <option value="accords">Accords</option>
                    <option value="off">Désactivée</option>
                </select>
            </div>
            <div class="config-group">
                <label>Main Gauche (Clé de Fa) :</label>
                <select id="cfg-mode-mg">
                    <option value="melodie" selected>Mélodie</option>
                    <option value="accords">Accords</option>
                    <option value="off">Désactivée</option>
                </select>
            </div>
        </div>

        <div class="flex-row">
            <div class="config-group">
                <label>Débit Clé de Sol (Densité) :</label>
                <select id="cfg-debit-treble">
                    <option value="160" selected>Débutant (Standard)</option>
                    <option value="128">Normal (+25 % de notes)</option>
                    <option value="102">Intermédiaire (+56 % de notes)</option>
                    <option value="82">Difficile (+95 % de notes)</option>
                    <option value="66">Pro (+144 % de notes)</option>
                </select>
            </div>
            <div class="config-group">
                <label>Débit Clé de Fa (Densité) :</label>
                <select id="cfg-debit-bass">
                    <option value="160" selected>Débutant (Standard)</option>
                    <option value="128">Normal (+25 % de notes)</option>
                    <option value="102">Intermédiaire (+56 % de notes)</option>
                    <option value="82">Difficile (+95 % de notes)</option>
                    <option value="66">Pro (+144 % de notes)</option>
                </select>
            </div>
        </div>

        <div class="flex-row">
            <div class="config-group">
                <label>Type d'Accords (si mode Accords activé) :</label>
                <select id="cfg-accords-inv">
                    <option value="fondamentale" selected>Position fondamentale</option>
                    <option value="renversements">Fondamentale + Renversements</option>
                </select>
            </div>
            <div class="config-group">
                <label>Accélération (toutes les 15 notes) :</label>
                <select id="cfg-acceleration">
                    <option value="0">Désactivée</option>
                    <option value="2">2 %</option>
                    <option value="5" selected>5 %</option>
                    <option value="8">8 %</option>
                </select>
            </div>
        </div>

        <div class="flex-row">
            <div class="config-group">
                <label>Vitesse linéaire globale de départ :</label>
                <select id="cfg-vitesse">
                    <option value="20">Grand Débutant</option>
                    <option value="40">Lent (Débutant)</option>
                    <option value="60" selected>Moyen (Initié)</option>
                    <option value="90">Rapide (Avancé)</option>
                </select>
            </div>
            <div class="config-group">
                <label>Fautes autorisées :</label>
                <select id="cfg-fautes">
                    <option value="1">1 (Mort subite)</option>
                    <option value="10" selected>10 fautes</option>
                    <option value="infinity">Mode Infini</option>
                </select>
            </div>
        </div>

        <div class="panel">
            <div class="flex-row">
                <div class="config-group">
                    <label>Ambitus Clé de Sol (pour Mélodie) :</label>
                    <select id="cfg-ambitus-treble" onchange="toggleCustomAmbitus()">
                        <option value="reduit">Réduit (Do4 - Do5)</option>
                        <option value="complet" selected>Complet (Do3 - Si6)</option>
                        <option value="custom">Sur mesure...</option>
                    </select>
                    <div id="custom-treble-panel" class="custom-ambitus-panel flex-row">
                        <div><label>De :</label><select id="treble-min"></select></div>
                        <div><label>À :</label><select id="treble-max"></select></div>
                    </div>
                </div>
                
                <div class="config-group">
                    <label>Ambitus Clé de Fa (pour Mélodie) :</label>
                    <select id="cfg-ambitus-bass" onchange="toggleCustomAmbitus()">
                        <option value="reduit">Réduit (Do3 - Do4)</option>
                        <option value="complet" selected>Complet (Fa1 - Si4)</option>
                        <option value="custom">Sur mesure...</option>
                    </select>
                    <div id="custom-bass-panel" class="custom-ambitus-panel flex-row">
                        <div><label>De :</label><select id="bass-min"></select></div>
                        <div><label>À :</label><select id="bass-max"></select></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex-row">
            <div class="config-group">
                <label>Tonalité (Armure) :</label>
                <select id="cfg-gamme">
                    <option value="C" selected>Do Maj / La Min (Rien)</option>
                    <option value="G">Sol Maj / Mi Min (1#)</option>
                    <option value="D">Ré Maj / Si Min (2#)</option>
                    <option value="A">La Maj / Fa# Min (3#)</option>
                    <option value="E">Mi Maj / Do# Min (4#)</option>
                    <option value="B">Si Maj / Sol# Min (5#)</option>
                    <option value="F#">Fa# Maj / Ré# Min (6#)</option>
                    <option value="F">Fa Maj / Ré Min (1b)</option>
                    <option value="Bb">Sib Maj / Sol Min (2b)</option>
                    <option value="Eb">Mib Maj / Do Min (3b)</option>
                    <option value="Ab">Lab Maj / Fa Min (4b)</option>
                    <option value="Db">Réb Maj / Sib Min (5b)</option>
                    <option value="Gb">Solb Maj / Mib Min (6b)</option>
                </select>
            </div>
            <div class="config-group"></div>
        </div>

        <button style="width: 100%; font-size: 22px; padding: 15px;" onclick="lancerJeu()">Démarrer l'entraînement</button>
    </div>

    <div id="game-ui">
        <div id="hud">
            <div class="stat" id="stat-level">Niveau : <span id="lbl-level">1</span></div>
            <div class="stat" id="stat-score">Score : <span id="lbl-score">0</span></div>
            <div class="stat" id="stat-fautes">Fautes : <span id="lbl-fautes">0</span></div>
            <button id="btn-pause" onclick="togglePause()">Pause (Espace)</button>
            <button style="background:#555;" onclick="retourMenu()">Menu</button>
        </div>
        
        <div id="viewport">
            <div id="bg-staves"></div>
            <div id="fixed-clefs"></div>
            <div id="hitzone"></div> 
            <div id="track"></div>
            
            <div id="pause-screen" class="overlay-screen">
                <h2>JEU EN PAUSE</h2>
                <button onclick="togglePause()">Reprendre (Espace)</button>
            </div>

            <div id="game-over-screen" class="overlay-screen">
                <h2>GAME OVER</h2>
                <p id="final-score" style="font-size: 22px; color:white; margin-bottom: 20px;"></p>
                <button onclick="lancerJeu()">Rejouer</button>
            </div>
        </div>
    </div>

    <script>
        const VF = Vex.Flow;
        
        let TOUTES_LES_NOTES = [];
        const notesCmaj = ["c", "d", "e", "f", "g", "a", "b"];
        const nomsFr = ["Do", "Ré", "Mi", "Fa", "Sol", "La", "Si"];
        
        const GAMMES = {
            "C":  [0, 2, 4, 5, 7, 9, 11],
            "G":  [0, 2, 4, 6, 7, 9, 11],
            "D":  [1, 2, 4, 6, 7, 9, 11],
            "A":  [1, 2, 4, 6, 8, 9, 11],
            "E":  [1, 3, 4, 6, 8, 9, 11],
            "B":  [1, 3, 4, 6, 8, 10, 11],
            "F#": [1, 3, 5, 6, 8, 10, 11],
            "F":  [0, 2, 4, 5, 7, 9, 10],
            "Bb": [0, 2, 3, 5, 7, 9, 10],
            "Eb": [0, 2, 3, 5, 7, 8, 10],
            "Ab": [0, 1, 3, 5, 7, 8, 10],
            "Db": [0, 1, 3, 5, 6, 8, 10],
            "Gb": [-1, 1, 3, 5, 6, 8, 10]
        };

        function genererBaseDeNotes(cleArmure) {
            TOUTES_LES_NOTES = [];
            const offsets = GAMMES[cleArmure];
            for (let oct = 1; oct <= 7; oct++) {
                for (let i = 0; i < 7; i++) {
                    let midiNum = (oct + 1) * 12 + offsets[i];
                    if (midiNum > 108) break;
                    TOUTES_LES_NOTES.push({
                        id: `${notesCmaj[i]}/${oct}`,
                        label: `${nomsFr[i]}${oct}`,
                        keys: [`${notesCmaj[i]}/${oct}`], 
                        acc: [""], 
                        midi: [midiNum] 
                    });
                }
            }
        }
        
        genererBaseDeNotes("C");

        function getNoteInfo(index) {
            const oct = Math.floor(index / 7) + 1;
            const noteIdx = index % 7;
            const key = notesCmaj[noteIdx] + "/" + oct;
            const armure = document.getElementById("cfg-gamme") ? document.getElementById("cfg-gamme").value : "C";
            const midi = (oct + 1) * 12 + GAMMES[armure][noteIdx];
            return { key, midi };
        }

        function generateTriad(rootIndex, inversionLevel) {
            let i1 = rootIndex;
            let i2 = rootIndex + 2;
            let i3 = rootIndex + 4;
            if (inversionLevel === 1) { i1 += 7; } 
            if (inversionLevel === 2) { i1 += 7; i2 += 7; } 
            let indices = [i1, i2, i3].sort((a,b) => a-b);
            return {
                keys: [getNoteInfo(indices[0]).key, getNoteInfo(indices[1]).key, getNoteInfo(indices[2]).key],
                acc: ["", "", ""],
                midi: [getNoteInfo(indices[0]).midi, getNoteInfo(indices[1]).midi, getNoteInfo(indices[2]).midi]
            };
        }

        function peuplerSelect(idSelect, defaultId) {
            const select = document.getElementById(idSelect);
            select.innerHTML = "";
            TOUTES_LES_NOTES.forEach(note => {
                let opt = document.createElement("option");
                opt.value = note.id; opt.innerText = note.label;
                if(note.id === defaultId) opt.selected = true;
                select.appendChild(opt);
            });
        }
        peuplerSelect("treble-min", "c/4"); peuplerSelect("treble-max", "b/5");
        peuplerSelect("bass-min", "c/2"); peuplerSelect("bass-max", "c/4");

        function toggleCustomAmbitus() {
            document.getElementById("custom-treble-panel").style.display = document.getElementById("cfg-ambitus-treble").value === "custom" ? "flex" : "none";
            document.getElementById("custom-bass-panel").style.display = document.getElementById("cfg-ambitus-bass").value === "custom" ? "flex" : "none";
        }

        function getPool(idMin, idMax) {
            let idxMin = TOUTES_LES_NOTES.findIndex(n => n.id === idMin);
            let idxMax = TOUTES_LES_NOTES.findIndex(n => n.id === idMax);
            if (idxMin > idxMax) [idxMin, idxMax] = [idxMax, idxMin]; 
            return TOUTES_LES_NOTES.slice(idxMin, idxMax + 1);
        }

        // --- ENTRAÎNEMENT & SYSTÈME RYTHMIQUE SÉPARÉ ---
        let config = { maxFautes: 10, modeInfini: false, vitesse: 60, acceleration: 5, modeMD: 'melodie', modeMG: 'melodie' };
        let poolTreble = [], poolBass = [];
        let jeuActif = false, enPause = false;
        let score = 0, fautes = 0, niveau = 1, notesValideesCeNiveau = 0;
        
        let currentX = 0; 
        let espacementTreble = 160;
        let espacementBass = 160;
        let dernierXTreble = 180; 
        let dernierXBass = 180;
        let colonnesEnCours = [];
        let dernierTimestamp = 0;
        const trackDOM = document.getElementById("track");

        function dessinerEnvironnementStatique() {
            const armure = document.getElementById("cfg-gamme").value; 
            const bgDiv = document.getElementById("bg-staves");
            bgDiv.innerHTML = "";
            const rendererBg = new VF.Renderer(bgDiv, VF.Renderer.Backends.SVG);
            rendererBg.resize(900, 450);
            const ctxBg = rendererBg.getContext();
            new VF.Stave(180, 70, 720).setContext(ctxBg).draw();
            new VF.Stave(180, 230, 720).setContext(ctxBg).draw();

            const clefsDiv = document.getElementById("fixed-clefs");
            clefsDiv.innerHTML = "";
            const rendererClefs = new VF.Renderer(clefsDiv, VF.Renderer.Backends.SVG);
            rendererClefs.resize(140, 450);
            const ctxClefs = rendererClefs.getContext();
            new VF.Stave(20, 70, 120).addClef("treble").addKeySignature(armure).setContext(ctxClefs).draw();
            new VF.Stave(20, 230, 120).addClef("bass").addKeySignature(armure).setContext(ctxClefs).draw();
        }

        function lancerJeu() {
            let armureChoisie = document.getElementById("cfg-gamme").value;
            genererBaseDeNotes(armureChoisie);
            
            let f = document.getElementById("cfg-fautes").value;
            config.modeInfini = (f === "infinity");
            config.maxFautes = config.modeInfini ? 0 : parseInt(f);
            config.vitesse = parseInt(document.getElementById("cfg-vitesse").value);
            config.acceleration = parseInt(document.getElementById("cfg-acceleration").value);
            config.modeMD = document.getElementById("cfg-mode-md").value;
            config.modeMG = document.getElementById("cfg-mode-mg").value;
            let invMode = document.getElementById("cfg-accords-inv").value;
            
            // Configuration des débits indépendants
            espacementTreble = parseInt(document.getElementById("cfg-debit-treble").value);
            espacementBass = parseInt(document.getElementById("cfg-debit-bass").value);

            poolTreble = []; poolBass = [];

            if (config.modeMD === 'melodie') {
                const tMode = document.getElementById("cfg-ambitus-treble").value;
                if(tMode === "reduit") poolTreble = getPool("c/4", "c/5");
                else if(tMode === "complet") poolTreble = getPool("c/3", "b/6");
                else poolTreble = getPool(document.getElementById("treble-min").value, document.getElementById("treble-max").value);
            } else if (config.modeMD === 'accords') {
                for(let r=21; r<=27; r++) {
                    poolTreble.push(generateTriad(r, 0));
                    if(invMode === "renversements") { poolTreble.push(generateTriad(r, 1)); poolTreble.push(generateTriad(r, 2)); }
                }
            }

            if (config.modeMG === 'melodie') {
                const bMode = document.getElementById("cfg-ambitus-bass").value;
                if(bMode === "reduit") poolBass = getPool("c/3", "c/4");
                else if(bMode === "complet") poolBass = getPool("f/1", "b/4");
                else poolBass = getPool(document.getElementById("bass-min").value, document.getElementById("bass-max").value);
            } else if (config.modeMG === 'accords') {
                for(let r=7; r<=13; r++) {
                    poolBass.push(generateTriad(r, 0));
                    if(invMode === "renversements") { poolBass.push(generateTriad(r, 1)); poolBass.push(generateTriad(r, 2)); }
                }
            }

            document.getElementById("menu-config").style.display = "none";
            document.getElementById("game-ui").style.display = "block";
            document.getElementById("game-over-screen").style.display = "none";
            document.getElementById("pause-screen").style.display = "none";

            dessinerEnvironnementStatique();

            score = 0; fautes = 0; niveau = 1; notesValideesCeNiveau = 0;
            currentX = 0; dernierXTreble = 180; dernierXBass = 180;
            colonnesEnCours = [];
            trackDOM.innerHTML = "";
            enPause = false;
            
            document.getElementById("lbl-score").innerText = score;
            document.getElementById("lbl-level").innerText = niveau;
            document.getElementById("lbl-fautes").innerText = config.modeInfini ? "0 (Infini)" : `0 / ${config.maxFautes}`;
            
            // Génération du flux initial
            while (dernierXTreble < 1000) {
                dernierXTreble += espacementTreble;
                if (config.modeMD !== "off") creerColonne(dernierXTreble, true, false);
            }
            while (dernierXBass < 1000) {
                dernierXBass += espacementBass;
                if (config.modeMG !== "off") creerColonne(dernierXBass, false, true);
            }
            
            jeuActif = true;
            dernierTimestamp = performance.now();
            requestAnimationFrame(boucleDeJeu);
        }

        function togglePause() {
            if (!jeuActif) return;
            enPause = !enPause;
            document.getElementById("pause-screen").style.display = enPause ? "flex" : "none";
            if (!enPause) { dernierTimestamp = performance.now(); requestAnimationFrame(boucleDeJeu); }
        }

        window.addEventListener('keydown', function(e) {
            if (e.code === 'Space' && document.getElementById("game-ui").style.display === "block") {
                e.preventDefault(); togglePause();
            }
        });

        function creerColonne(absoluteX, includeTreble, includeBass) {
            const tItem = includeTreble ? poolTreble[Math.floor(Math.random() * poolTreble.length)] : null;
            const bItem = includeBass ? poolBass[Math.floor(Math.random() * poolBass.length)] : null;

            const colDiv = document.createElement("div");
            colDiv.className = "note-column";
            trackDOM.appendChild(colDiv);

            const colonneObj = {
                xBase: absoluteX, element: colDiv, processed: false,
                treble: includeTreble ? { keys: tItem.keys, acc: tItem.acc, midi: tItem.midi, pressed: [], status: 'pending' } : { status: 'ignored' },
                bass: includeBass ? { keys: bItem.keys, acc: bItem.acc, midi: bItem.midi, pressed: [], status: 'pending' } : { status: 'ignored' }
            };

            redessinerColonne(colonneObj);
            colonnesEnCours.push(colonneObj);
        }

        function redessinerColonne(col) {
            col.element.innerHTML = ""; 
            const renderer = new VF.Renderer(col.element, VF.Renderer.Backends.SVG);
            renderer.resize(100, 450); 
            const context = renderer.getContext();

            const staveTreble = new VF.Stave(0, 70, 100);
            const staveBass = new VF.Stave(0, 230, 100);
            const voices = [];

            if (col.treble.status !== 'ignored') {
                const noteT = new VF.StaveNote({ clef: "treble", keys: col.treble.keys, duration: "q" });
                col.treble.acc.forEach((a, i) => { if(a) noteT.addModifier(new VF.Accidental(a), i); });
                appliquerCouleur(noteT, col.treble.status);
                voices.push(new VF.Voice({num_beats: 1, beat_value: 4}).addTickables([noteT]));
            }
            if (col.bass.status !== 'ignored') {
                const noteB = new VF.StaveNote({ clef: "bass", keys: col.bass.keys, duration: "q" });
                col.bass.acc.forEach((a, i) => { if(a) noteB.addModifier(new VF.Accidental(a), i); });
                appliquerCouleur(noteB, col.bass.status);
                voices.push(new VF.Voice({num_beats: 1, beat_value: 4}).addTickables([noteB]));
            }

            if (voices.length > 0) {
                new VF.Formatter().joinVoices(voices).format(voices, 50);
                if (col.treble.status !== 'ignored') voices[0].draw(context, staveTreble);
                if (col.bass.status !== 'ignored') voices[voices.length - 1].draw(context, staveBass);
            }
        }

        function appliquerCouleur(staveNote, status) {
            if (status === 'hit') staveNote.setStyle({ fillStyle: "#2ecc71", strokeStyle: "#2ecc71" });
            else if (status === 'missed') staveNote.setStyle({ fillStyle: "#e74c3c", strokeStyle: "#e74c3c" });
            else staveNote.setStyle({ fillStyle: "#2c3e50", strokeStyle: "#2c3e50" });
        }

        function boucleDeJeu(timestamp) {
            if (!jeuActif || enPause) return;
            let dt = (timestamp - dernierTimestamp) / 1000;
            dernierTimestamp = timestamp;

            currentX += config.vitesse * dt;

            for (let col of colonnesEnCours) {
                let positionEcran = col.xBase - currentX;
                col.element.style.transform = `translateX(${positionEcran}px)`;

                if (!col.processed && positionEcran < 150) { 
                    let updated = false;
                    if (col.treble.status === 'pending') { col.treble.status = 'missed'; fautes++; updated = true; }
                    if (col.bass.status === 'pending') { col.bass.status = 'missed'; fautes++; updated = true; }
                    
                    if(updated) {
                        col.processed = true;
                        redessinerColonne(col);
                        document.getElementById("lbl-fautes").innerText = config.modeInfini ? `${fautes} (Infini)` : `${fautes} / ${config.maxFautes}`;
                        if (!config.modeInfini && fautes >= config.maxFautes) { terminerJeu(); return; }
                    }
                }
            }

            colonnesEnCours = colonnesEnCours.filter(col => {
                if (col.xBase - currentX < -100) { col.element.remove(); return false; }
                return true; 
            });

            // Avancement autonome des flux respectifs
            while (dernierXTreble < currentX + 1000) {
                dernierXTreble += espacementTreble;
                if (config.modeMD !== "off") creerColonne(dernierXTreble, true, false);
            }
            while (dernierXBass < currentX + 1000) {
                dernierXBass += espacementBass;
                if (config.modeMG !== "off") creerColonne(dernierXBass, false, true);
            }

            requestAnimationFrame(boucleDeJeu);
        }

        function terminerJeu() {
            jeuActif = false;
            document.getElementById("final-score").innerText = `Niveau ${niveau} | Score : ${score} pts`;
            document.getElementById("game-over-screen").style.display = "flex";
        }

        function retourMenu() {
            jeuActif = false; enPause = false;
            document.getElementById("game-ui").style.display = "none";
            document.getElementById("menu-config").style.display = "block";
        }

        function getMIDIMessage(midiMessage) {
            if (!jeuActif || enPause) return;

            const command = midiMessage.data[0];
            const noteJouee = midiMessage.data[1];
            const velocity = (midiMessage.data.length > 2) ? midiMessage.data[2] : 0;

            if (command === 144 && velocity > 0) {
                // Recherche de la première note attendue dans la zone de frappe
                let cible = colonnesEnCours.find(col => {
                    let posEcr = col.xBase - currentX;
                    return !col.processed && posEcr >= 150 && posEcr <= 250; 
                });
                
                if (cible) {
                    let noteValidee = false;

                    if (cible.treble.status === 'pending' && cible.treble.midi.includes(noteJouee)) {
                        if (!cible.treble.pressed.includes(noteJouee)) cible.treble.pressed.push(noteJouee);
                        if (cible.treble.pressed.length === cible.treble.midi.length) {
                            cible.treble.status = 'hit'; score += (10 * cible.treble.midi.length); noteValidee = true;
                        }
                    }
                    
                    if (cible.bass.status === 'pending' && cible.bass.midi.includes(noteJouee)) {
                        if (!cible.bass.pressed.includes(noteJouee)) cible.bass.pressed.push(noteJouee);
                        if (cible.bass.pressed.length === cible.bass.midi.length) {
                            cible.bass.status = 'hit'; score += (10 * cible.bass.midi.length); noteValidee = true;
                        }
                    }

                    if (noteValidee) {
                        document.getElementById("lbl-score").innerText = score;
                        redessinerColonne(cible);
                        
                        if ((cible.treble.status === 'hit' || cible.treble.status === 'ignored') && 
                            (cible.bass.status === 'hit' || cible.bass.status === 'ignored')) {
                            cible.processed = true;
                            notesValideesCeNiveau++;
                            if (notesValideesCeNiveau >= 15) {
                                niveau++; notesValideesCeNiveau = 0; 
                                config.vitesse *= (1 + (config.acceleration / 100));
                                document.getElementById("lbl-level").innerText = niveau;
                            }
                        }
                    }
                }
            }
        }

        if (navigator.requestMIDIAccess) {
            navigator.requestMIDIAccess().then(
                midiAccess => {
                    document.getElementById("midi-status").innerText = "Piano détecté. Prêt !";
                    document.getElementById("midi-status").style.color = "#2ecc71";
                    for (let input of midiAccess.inputs.values()) input.onmidimessage = getMIDIMessage;
                },
                () => { document.getElementById("midi-status").innerText = "Erreur MIDI."; }
            );
        }
    </script>
</body>
</html>
